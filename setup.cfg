[flake8]
# black owns code width (88). This value keeps the two tools talking about the
# same number; E501 itself is ignored below.
max-line-length = 88

# E203 - whitespace before ':' in slices; black formats slices the way pycodestyle dislikes.
# W503 - line break before a binary operator; black puts the operator on the new line.
# E501 - line too long. black already enforces 88 for *code*. The only lines that stay
#        long are docstrings and comments, which black never reflows. Flagging those
#        would mean 362 permanent errors, so the gate would be ignored, not obeyed.
extend-ignore = E203, W503, E501

exclude =
    .git,
    .venv,
    __pycache__,
    */migrations/*,
    staticfiles,
    media,
    reports

per-file-ignores =
    # Channels requires get_asgi_application() to run before app modules are
    # imported, so these imports legitimately sit below module level.
    evaluation_form_service/asgi.py: E402

# No max-complexity gate on purpose: four existing functions score 16-18, so
# enabling it would make the pre-commit chain red on day one. Revisit after
# CanScoreOrFeedback.has_object_permission and WorkingFormUpdateSerializer.validate
# are split up.
