services:
  evaluation_form:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py collectstatic --no-input &&
            daphne -b 0.0.0.0 -p 8000 evaluation_form_service.asgi:application"
    depends_on:
      - db
      - redis


  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py wait_for_db &&
          celery -A evaluation_form_service worker -l INFO"
    volumes:
      - ./:/app
    depends_on:
      - evaluation_form
      - redis
      - db
    restart: on-failure
    env_file:
      - .env

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py wait_for_db &&
          celery -A evaluation_form_service beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ./:/app
    depends_on:
      - evaluation_form
      - redis
      - db
    restart: on-failure
    env_file:
      - .env


  flower:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    command: >
      sh -c "python manage.py wait_for_db &&
          celery -A evaluation_form_service flower --address=0.0.0.0"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - celery
    env_file:
      - .env

volumes:
  my_db:
