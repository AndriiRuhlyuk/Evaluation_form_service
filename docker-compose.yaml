services:
  evaluation_form:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py collectstatic --no-input &&
            daphne -b 0.0.0.0 -p 8000 evaluation_form_service.asgi:application"
    depends_on:
      - db
      - redis


  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

volumes:
  my_db:
